<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laundry Service</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            Laundry
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Contact Us</a>
            <a href="#">About Us</a>
        </div>

        <div class="user-area">
            <span class="username">User</span>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>
        </div>

    </nav>


    <!-- MAIN CONTAINER -->
    <main class="main-container">


        <!-- LEFT SIDE -->
        <div class="left-column">


            <!-- ADDED ITEMS -->
            <div class="card added-card">

                <h2>Added Items</h2>

                <table>

                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Service Name</th>
                            <th>Price</th>
                        </tr>
                    </thead>

                    <tbody id="cartItems">

                        <tr id="emptyRow">
                            <td colspan="3">
                                No Items Added
                            </td>
                        </tr>

                    </tbody>

                </table>


                <div class="total-section">

                    <strong>Total Amount</strong>

                    <strong id="totalAmount">
                        ₹0.00
                    </strong>

                </div>

            </div>



            <!-- BOOK NOW -->
            <div class="card booking-card">

                <h2>Book Now</h2>

                <form id="bookingForm">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="John Doe"
                        required
                    >


                    <div class="input-row">

                        <div>

                            <label for="email">
                                Email ID
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="john@gmail.com"
                                required
                            >

                        </div>


                        <div>

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="9876543210"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="book-btn"
                    >
                        Book now
                    </button>

                </form>

                <p id="bookingMessage"></p>

            </div>

        </div>



        <!-- RIGHT SIDE -->
        <div class="right-column">

            <div class="card services-card">

                <h2>
                    Browse Our Services
                </h2>

                <p class="description">
                    Click on the add to cart button to add the services
                    to your cart or press skip
                </p>


                <div class="service-area">


                    <!-- SERVICE IMAGE -->
                    <img
                        id="serviceImage"
                        class="service-image"
                        src=""
                        alt="Service"
                    >


                    <!-- SERVICE NAME AND PRICE -->
                    <div class="service-info">

                        <h3 id="serviceName"></h3>

                        <span id="servicePrice"></span>

                    </div>


                    <!-- BUTTONS -->
                    <div class="service-buttons">

                        <button
                            type="button"
                            id="skipBtn"
                            class="skip-btn"
                        >
                            Skip Item ⊖
                        </button>


                        <button
                            type="button"
                            id="addBtn"
                            class="add-btn"
                        >
                            Add Item ⊕
                        </button>

                    </div>

                </div>


                <div class="bottom-info">
                    ⓘ Add the items to the cart and book now
                </div>

            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
